version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quiz_postgres
    environment:
      POSTGRES_DB: game_time_db
      POSTGRES_USER: gametime
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: quiz_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gametime.com
      PGADMIN_DEFAULT_PASSWORD: secret123
    ports:
      - "8081:80"
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: quiz_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Lightweight real-time log viewer container
  dozzle:
    image: amir20/dozzle:latest
    container_name: quiz_log_viewer
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  postgres_data: